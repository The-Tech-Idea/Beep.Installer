name: Beep Installer Headless CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_SCRIPT: Beep.Installer/samples/ServiceApp.bsetup
  ARTIFACT_DIR: artifacts/headless
  SDK_PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}
  SDK_FEED: https://api.nuget.org/v3/index.json

jobs:
  linux-schema-validation:
    name: Linux SDK schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore headless SDK consumer
        run: dotnet restore Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj

      - name: Build headless SDK consumer
        run: dotnet build Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore --nologo --verbosity quiet

      - name: Validate installer schema through headless SDK
        run: |
          mkdir -p "$ARTIFACT_DIR/linux"
          dotnet run --project Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore -- validate "$PROJECT_SCRIPT" | tee "$ARTIFACT_DIR/linux/validate.txt"

      - name: Compile installer plan through headless SDK
        run: |
          mkdir -p "$ARTIFACT_DIR/linux"
          dotnet run --project Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore -- plan "$PROJECT_SCRIPT" | tee "$ARTIFACT_DIR/linux/plan.txt"

      - name: Finalize Linux validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:ARTIFACT_DIR "linux"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null

          $manifest = [ordered]@{
            schemaVersion = "1.0"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("O")
            provider = "github-actions"
            workflow = "${{ github.workflow }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            repository = "${{ github.repository }}"
            sourceRevision = "${{ github.sha }}"
            sourceRef = "${{ github.ref }}"
            projectScript = "${env:PROJECT_SCRIPT}"
            evidenceRoots = [ordered]@{
              sdkValidateOutput = "validate.txt"
              sdkPlanOutput = "plan.txt"
            }
            evidenceExists = [ordered]@{
              sdkValidateOutput = (Test-Path (Join-Path $evidenceDir "validate.txt"))
              sdkPlanOutput = (Test-Path (Join-Path $evidenceDir "plan.txt"))
            }
          }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir "ci-evidence-manifest.json") -Encoding utf8

      - name: Publish Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beep-installer-linux-validation
          path: ${{ env.ARTIFACT_DIR }}/linux

  validate-plan-build:
    name: Validate, plan and build installer
    runs-on: windows-latest
    needs: linux-schema-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        shell: pwsh
        run: dotnet restore Beep.Installer.Tests/Beep.Installer.Tests.csproj

      - name: Verify headless SDK parity
        shell: pwsh
        run: dotnet test Beep.Installer.Tests/Beep.Installer.Tests.csproj --filter "HeadlessInstallerSdkTests|InstallPlanCompilerTests|ProjectSchemaServiceTests" --no-restore --nologo --verbosity quiet

      - name: Validate installer script
        shell: pwsh
        run: dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /VALIDATE="${env:PROJECT_SCRIPT}" /STRICT

      - name: Compile deterministic install plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:ARTIFACT_DIR}" | Out-Null
          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /PLAN="${env:PROJECT_SCRIPT}" /JSON /OUT="${env:ARTIFACT_DIR}/install-plan.json"

      - name: Build unsigned development artifact
        shell: pwsh
        run: dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /BUILD="${env:PROJECT_SCRIPT}" /OUT="${env:ARTIFACT_DIR}/unsigned"

      - name: Publish release evidence for development artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${env:ARTIFACT_DIR}/unsigned" -Filter *.exe -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer executable was produced under ${env:ARTIFACT_DIR}/unsigned."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /EVIDENCE="${env:PROJECT_SCRIPT}" /INSTALLER="$($installer.FullName)" /OUT="${env:ARTIFACT_DIR}/evidence" /SOURCEREVISION="${env:GITHUB_SHA}"

      - name: Build signed release artifact when signing secrets are configured
        shell: pwsh
        env:
          BEEP_SIGNING_CERT_BASE64: ${{ secrets.BEEP_SIGNING_CERT_BASE64 }}
          BEEP_SIGNING_PASSWORD: ${{ secrets.BEEP_SIGNING_PASSWORD }}
          BEEP_SIGNING_SUBJECT: ${{ vars.BEEP_SIGNING_SUBJECT }}
          BEEP_TIMESTAMP_URL: ${{ vars.BEEP_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BEEP_SIGNING_CERT_BASE64)) {
            Write-Host "Signing secrets are not configured; signed release build skipped."
            return
          }

          $signingDir = Join-Path $env:RUNNER_TEMP "beep-signing"
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          $certPath = Join-Path $signingDir "release.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:BEEP_SIGNING_CERT_BASE64))

          $args = @(
            "/BUILD=${env:PROJECT_SCRIPT}",
            "/OUT=${env:ARTIFACT_DIR}/signed",
            "/SIGNCERT=$certPath",
            "/SIGNPASSWORD=secret://env/BEEP_SIGNING_PASSWORD",
            "/REQUIRESIGNED"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:BEEP_SIGNING_SUBJECT)) {
            $args += "/SIGNINGSUBJECT=$env:BEEP_SIGNING_SUBJECT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BEEP_TIMESTAMP_URL)) {
            $args += "/TIMESTAMP=$env:BEEP_TIMESTAMP_URL"
            $args += "/TIMESTAMPOUTAGE=retry"
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- $args

      - name: Pack headless SDK package
        shell: pwsh
        run: dotnet pack Beep.Installer.Core/Beep.Installer.Core.csproj --no-restore --nologo --configuration Release --output "${env:ARTIFACT_DIR}/sdk" /p:PackageVersion="${env:SDK_PACKAGE_VERSION}"

      - name: Verify packaged SDK consumer
        shell: pwsh
        run: |
          dotnet restore Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj `
            -p:UsePackagedBeepInstallerSdk=true `
            -p:BeepInstallerSdkVersion="${env:SDK_PACKAGE_VERSION}" `
            --source "${env:ARTIFACT_DIR}/sdk"

          dotnet build Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj `
            --no-restore `
            --nologo `
            --verbosity quiet `
            -p:UsePackagedBeepInstallerSdk=true `
            -p:BeepInstallerSdkVersion="${env:SDK_PACKAGE_VERSION}"

      - name: Validate SDK package publish command
        shell: pwsh
        run: |
          $package = Get-ChildItem "${env:ARTIFACT_DIR}/sdk" -Filter *.nupkg -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $package) {
            throw "No SDK package was produced under ${env:ARTIFACT_DIR}/sdk."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /PUBLISHSDK="$($package.FullName)" /SDKFEED="${env:SDK_FEED}" /DRYRUN /OUT="${env:ARTIFACT_DIR}/sdk-publish-dry-run"

      - name: Publish SDK package when NuGet secret is configured
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NUGET_API_KEY is not configured; SDK package publish skipped."
            return
          }

          $package = Get-ChildItem "${env:ARTIFACT_DIR}/sdk" -Filter *.nupkg -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $package) {
            throw "No SDK package was produced under ${env:ARTIFACT_DIR}/sdk."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-restore -- /PUBLISHSDK="$($package.FullName)" /SDKFEED="${env:SDK_FEED}" /SDKAPIKEY=secret://env/NUGET_API_KEY /OUT="${env:ARTIFACT_DIR}/sdk-publish"

      - name: Finalize archived CI evidence manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:ARTIFACT_DIR}" | Out-Null

          $manifest = [ordered]@{
            schemaVersion = "1.0"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("O")
            provider = "github-actions"
            workflow = "${{ github.workflow }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            repository = "${{ github.repository }}"
            sourceRevision = "${{ github.sha }}"
            sourceRef = "${{ github.ref }}"
            projectScript = "${env:PROJECT_SCRIPT}"
            sdkPackageVersion = "${env:SDK_PACKAGE_VERSION}"
            sdkFeed = "${env:SDK_FEED}"
            upstreamArtifacts = @("beep-installer-linux-validation")
            evidenceRoots = [ordered]@{
              deterministicPlan = "install-plan.json"
              unsignedBuild = "unsigned"
              releaseEvidence = "evidence"
              signedBuild = "signed"
              sdkPackage = "sdk"
              sdkPublishDryRun = "sdk-publish-dry-run"
              sdkPublish = "sdk-publish"
            }
            evidenceExists = [ordered]@{
              deterministicPlan = (Test-Path "${env:ARTIFACT_DIR}/install-plan.json")
              unsignedBuild = (Test-Path "${env:ARTIFACT_DIR}/unsigned")
              releaseEvidence = (Test-Path "${env:ARTIFACT_DIR}/evidence")
              signedBuild = (Test-Path "${env:ARTIFACT_DIR}/signed")
              sdkPackage = (Test-Path "${env:ARTIFACT_DIR}/sdk")
              sdkPublishDryRun = (Test-Path "${env:ARTIFACT_DIR}/sdk-publish-dry-run")
              sdkPublish = (Test-Path "${env:ARTIFACT_DIR}/sdk-publish")
            }
          }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "${env:ARTIFACT_DIR}/ci-evidence-manifest.json" -Encoding utf8

      - name: Publish headless artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beep-installer-headless
          path: ${{ env.ARTIFACT_DIR }}
