name: Beep Installer Headless CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

# This repository does not build standalone: Beep.Installer.csproj and Beep.Installer.Core.csproj
# reference ..\..\BeepDM\ and ..\..\Beep.Winform\ by relative path, and DataManagementModels must
# bind to the *source* project rather than the same-versioned package (see CLAUDE.md). Every job
# therefore checks this repository out into a subdirectory so its siblings can sit beside it, and
# defaults its `run` steps into that subdirectory.
env:
  DOTNET_VERSION: 10.0.x
  PROJECT_SCRIPT: Beep.Installer/samples/ServiceApp.bsetup
  ARTIFACT_DIR: artifacts/headless
  SDK_PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}
  SDK_FEED: https://api.nuget.org/v3/index.json

jobs:
  linux-schema-validation:
    name: Linux SDK schema validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Beep.Installer

    steps:
      - name: Checkout Beep.Installer
        uses: actions/checkout@v4
        with:
          path: Beep.Installer
          fetch-depth: 0

      # Core project-references DataManagementModels/Engine, so the SDK consumer cannot restore
      # without BeepDM beside this checkout. SIBLING_REPOS_TOKEN is only needed if BeepDM is
      # private; the default token covers a public sibling.
      - name: Checkout BeepDM
        uses: actions/checkout@v4
        with:
          repository: The-Tech-Idea/BeepDM
          path: BeepDM
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Beep.Installer/**/*.csproj', 'BeepDM/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore headless SDK consumer
        run: dotnet restore Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj

      - name: Build headless SDK consumer
        run: dotnet build Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore --nologo --verbosity quiet

      - name: Validate installer schema through headless SDK
        run: |
          mkdir -p "$ARTIFACT_DIR/linux"
          dotnet run --project Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore -- validate "$PROJECT_SCRIPT" | tee "$ARTIFACT_DIR/linux/validate.txt"

      - name: Compile installer plan through headless SDK
        run: |
          mkdir -p "$ARTIFACT_DIR/linux"
          dotnet run --project Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj --no-restore -- plan "$PROJECT_SCRIPT" | tee "$ARTIFACT_DIR/linux/plan.txt"

      - name: Finalize Linux validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:ARTIFACT_DIR "linux"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null

          $manifest = [ordered]@{
            schemaVersion = "1.0"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("O")
            provider = "github-actions"
            workflow = "${{ github.workflow }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            repository = "${{ github.repository }}"
            sourceRevision = "${{ github.sha }}"
            sourceRef = "${{ github.ref }}"
            projectScript = "${env:PROJECT_SCRIPT}"
            evidenceRoots = [ordered]@{
              sdkValidateOutput = "validate.txt"
              sdkPlanOutput = "plan.txt"
            }
            evidenceExists = [ordered]@{
              sdkValidateOutput = (Test-Path (Join-Path $evidenceDir "validate.txt"))
              sdkPlanOutput = (Test-Path (Join-Path $evidenceDir "plan.txt"))
            }
          }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir "ci-evidence-manifest.json") -Encoding utf8

      - name: Publish Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beep-installer-linux-validation
          path: Beep.Installer/${{ env.ARTIFACT_DIR }}/linux

  validate-plan-build:
    name: Validate, plan and build installer
    runs-on: windows-latest
    needs: linux-schema-validation
    defaults:
      run:
        working-directory: Beep.Installer

    steps:
      - name: Checkout Beep.Installer
        uses: actions/checkout@v4
        with:
          path: Beep.Installer
          fetch-depth: 0

      - name: Checkout BeepDM
        uses: actions/checkout@v4
        with:
          repository: The-Tech-Idea/BeepDM
          path: BeepDM
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      # The WinForms shell references Beep.Winform.Controls and Vis.Modules by relative path.
      - name: Checkout Beep.Winform
        uses: actions/checkout@v4
        with:
          repository: The-Tech-Idea/Beep.Winform
          path: Beep.Winform
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Beep.Installer/**/*.csproj', 'BeepDM/**/*.csproj', 'Beep.Winform/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The whole solution, not only the projects later steps happen to run. UpdateServer and the
      # two extension libraries are reachable no other way, and a merge once shipped a broken
      # reference that only UpdateServer would have caught.
      - name: Build the solution
        shell: pwsh
        run: dotnet build Beep.Installer.slnx --nologo --verbosity quiet

      # If NuGet resolved the same-versioned TheTechIdea.Beep.DataManagementModels package instead
      # of the source project, the app fails at runtime with TypeLoadException on newer BeepDM
      # types — the original P0 defect, and invisible at build time. Assert the assembly the tests
      # load is byte-identical to one the BeepDM source build just produced.
      - name: Assert DataManagementModels bound to source, not a package
        shell: pwsh
        run: |
          $loaded = Get-ChildItem -Path "Beep.Installer.Tests/bin" -Filter DataManagementModels.dll -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $loaded) { throw "No DataManagementModels.dll in the test output; the build never bound it." }

          $sourceBuilt = Get-ChildItem -Path "../BeepDM/DataManagementModelsStandard/bin" -Filter DataManagementModels.dll -Recurse -File -ErrorAction SilentlyContinue
          if (-not $sourceBuilt) { throw "The BeepDM source build produced no DataManagementModels.dll; the sibling checkout did not build." }

          $loadedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $loaded.FullName).Hash
          $sourceHashes = $sourceBuilt | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash }
          if ($sourceHashes -notcontains $loadedHash) {
            throw "DataManagementModels.dll in the test output matches no BeepDM source build output - a stale package won the reference. See the NU1605 note in CLAUDE.md."
          }
          Write-Host "DataManagementModels is source-bound ($loadedHash)."

      # The full suite. A three-class filter is what let a merge with unresolved conflict markers
      # sit on master with the tree unbuildable and 38 tests failing.
      - name: Run the test suite
        shell: pwsh
        run: dotnet test Beep.Installer.Tests/Beep.Installer.Tests.csproj --no-build --nologo --verbosity quiet

      - name: Validate installer script
        shell: pwsh
        run: dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /VALIDATE="${env:PROJECT_SCRIPT}" /STRICT

      - name: Compile deterministic install plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:ARTIFACT_DIR}" | Out-Null
          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /PLAN="${env:PROJECT_SCRIPT}" /JSON /OUT="${env:ARTIFACT_DIR}/install-plan.json"

      - name: Build unsigned development artifact
        shell: pwsh
        run: dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /BUILD="${env:PROJECT_SCRIPT}" /OUT="${env:ARTIFACT_DIR}/unsigned"

      # 9.B.2 -- the suite exercises the pieces, but nothing in CI ever ran a built installer
      # end to end. /SELFTEST installs into %TEMP%, verifies the result and uninstalls, so a
      # regression that only shows up in a real install (a payload rebased wrong, a step ordering
      # change, a locked-file path) fails the build instead of shipping.
      - name: Self-test the built installer (install -> verify -> uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${env:ARTIFACT_DIR}/unsigned" -Filter *.exe -File |
                       Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer executable was produced under ${env:ARTIFACT_DIR}/unsigned."
          }

          Write-Host "Self-testing $($installer.FullName)"
          & $installer.FullName /SELFTEST
          $code = $LASTEXITCODE

          # 3010 is "succeeded, reboot required" -- a legitimate success on a machine where a
          # payload file was in use. Anything else is a failure.
          if ($code -eq 0) {
            Write-Host "Self-test passed."
          } elseif ($code -eq 3010) {
            Write-Host "Self-test passed; a reboot is pending (exit 3010)."
          } else {
            throw "Self-test failed with exit code $code."
          }

      # A second pass over the same machine state: an installer that only works on a clean box is
      # a real and common defect, and this is where an upgrade/repair path regression surfaces.
      - name: Self-test again over the previous install
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${env:ARTIFACT_DIR}/unsigned" -Filter *.exe -File |
                       Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          & $installer.FullName /SELFTEST
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 3010) {
            throw "Repeat self-test failed with exit code $code (a first run is not enough)."
          }

      - name: Publish release evidence for development artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${env:ARTIFACT_DIR}/unsigned" -Filter *.exe -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer executable was produced under ${env:ARTIFACT_DIR}/unsigned."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /EVIDENCE="${env:PROJECT_SCRIPT}" /INSTALLER="$($installer.FullName)" /OUT="${env:ARTIFACT_DIR}/evidence" /SOURCEREVISION="${env:GITHUB_SHA}"

      - name: Build signed release artifact when signing secrets are configured
        shell: pwsh
        env:
          BEEP_SIGNING_CERT_BASE64: ${{ secrets.BEEP_SIGNING_CERT_BASE64 }}
          BEEP_SIGNING_PASSWORD: ${{ secrets.BEEP_SIGNING_PASSWORD }}
          BEEP_SIGNING_SUBJECT: ${{ vars.BEEP_SIGNING_SUBJECT }}
          BEEP_TIMESTAMP_URL: ${{ vars.BEEP_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BEEP_SIGNING_CERT_BASE64)) {
            Write-Host "Signing secrets are not configured; signed release build skipped."
            return
          }

          $signingDir = Join-Path $env:RUNNER_TEMP "beep-signing"
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          $certPath = Join-Path $signingDir "release.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:BEEP_SIGNING_CERT_BASE64))

          $args = @(
            "/BUILD=${env:PROJECT_SCRIPT}",
            "/OUT=${env:ARTIFACT_DIR}/signed",
            "/SIGNCERT=$certPath",
            "/SIGNPASSWORD=secret://env/BEEP_SIGNING_PASSWORD",
            "/REQUIRESIGNED"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:BEEP_SIGNING_SUBJECT)) {
            $args += "/SIGNINGSUBJECT=$env:BEEP_SIGNING_SUBJECT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BEEP_TIMESTAMP_URL)) {
            $args += "/TIMESTAMP=$env:BEEP_TIMESTAMP_URL"
            $args += "/TIMESTAMPOUTAGE=retry"
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- $args

      - name: Pack headless SDK package
        shell: pwsh
        run: dotnet pack Beep.Installer.Core/Beep.Installer.Core.csproj --no-restore --nologo --configuration Release --output "${env:ARTIFACT_DIR}/sdk" /p:PackageVersion="${env:SDK_PACKAGE_VERSION}"

      - name: Verify packaged SDK consumer
        shell: pwsh
        run: |
          dotnet restore Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj `
            -p:UsePackagedBeepInstallerSdk=true `
            -p:BeepInstallerSdkVersion="${env:SDK_PACKAGE_VERSION}" `
            --source "${env:ARTIFACT_DIR}/sdk"

          dotnet build Beep.Installer/samples/HeadlessSdkConsumer/HeadlessSdkConsumer.csproj `
            --no-restore `
            --nologo `
            --verbosity quiet `
            -p:UsePackagedBeepInstallerSdk=true `
            -p:BeepInstallerSdkVersion="${env:SDK_PACKAGE_VERSION}"

      - name: Validate SDK package publish command
        shell: pwsh
        run: |
          $package = Get-ChildItem "${env:ARTIFACT_DIR}/sdk" -Filter *.nupkg -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $package) {
            throw "No SDK package was produced under ${env:ARTIFACT_DIR}/sdk."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /PUBLISHSDK="$($package.FullName)" /SDKFEED="${env:SDK_FEED}" /DRYRUN /OUT="${env:ARTIFACT_DIR}/sdk-publish-dry-run"

      - name: Publish SDK package when NuGet secret is configured
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NUGET_API_KEY is not configured; SDK package publish skipped."
            return
          }

          $package = Get-ChildItem "${env:ARTIFACT_DIR}/sdk" -Filter *.nupkg -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $package) {
            throw "No SDK package was produced under ${env:ARTIFACT_DIR}/sdk."
          }

          dotnet run --project Beep.Installer/Beep.Installer.csproj --no-build -- /PUBLISHSDK="$($package.FullName)" /SDKFEED="${env:SDK_FEED}" /SDKAPIKEY=secret://env/NUGET_API_KEY /OUT="${env:ARTIFACT_DIR}/sdk-publish"

      - name: Finalize archived CI evidence manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:ARTIFACT_DIR}" | Out-Null

          $manifest = [ordered]@{
            schemaVersion = "1.0"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("O")
            provider = "github-actions"
            workflow = "${{ github.workflow }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            repository = "${{ github.repository }}"
            sourceRevision = "${{ github.sha }}"
            sourceRef = "${{ github.ref }}"
            projectScript = "${env:PROJECT_SCRIPT}"
            sdkPackageVersion = "${env:SDK_PACKAGE_VERSION}"
            sdkFeed = "${env:SDK_FEED}"
            upstreamArtifacts = @("beep-installer-linux-validation")
            evidenceRoots = [ordered]@{
              deterministicPlan = "install-plan.json"
              unsignedBuild = "unsigned"
              releaseEvidence = "evidence"
              signedBuild = "signed"
              sdkPackage = "sdk"
              sdkPublishDryRun = "sdk-publish-dry-run"
              sdkPublish = "sdk-publish"
            }
            evidenceExists = [ordered]@{
              deterministicPlan = (Test-Path "${env:ARTIFACT_DIR}/install-plan.json")
              unsignedBuild = (Test-Path "${env:ARTIFACT_DIR}/unsigned")
              releaseEvidence = (Test-Path "${env:ARTIFACT_DIR}/evidence")
              signedBuild = (Test-Path "${env:ARTIFACT_DIR}/signed")
              sdkPackage = (Test-Path "${env:ARTIFACT_DIR}/sdk")
              sdkPublishDryRun = (Test-Path "${env:ARTIFACT_DIR}/sdk-publish-dry-run")
              sdkPublish = (Test-Path "${env:ARTIFACT_DIR}/sdk-publish")
            }
          }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "${env:ARTIFACT_DIR}/ci-evidence-manifest.json" -Encoding utf8

      - name: Publish headless artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beep-installer-headless
          path: Beep.Installer/${{ env.ARTIFACT_DIR }}
